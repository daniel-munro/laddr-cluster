star_bin: /data/hps/assoc/private/gdml/user/dmunro/miniforge3/envs/pantry/bin/STAR-avx2
samtools_bin: /data/hps/assoc/private/gdml/user/dmunro/miniforge3/envs/pantry/bin/samtools
bamcoverage_bin: /data/hps/assoc/private/gdml/user/dmunro/miniforge3/envs/pantry/bin/bamCoverage
seqtk_bin: /data/hps/assoc/private/gdml/user/dmunro/miniforge3/bin/seqtk
laddr_bin: /data/hps/assoc/private/gdml/user/dmunro/miniforge3/envs/pantry/bin/laddr

star_threads: 8
bigwig_threads: 4

analyses:
  unstranded:
    config: configs/unstranded/config.yaml
    manifest: data/coverage_manifest_unstranded.tsv
